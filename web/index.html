<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mibox · 小爱音箱控制中心</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>mibox</h1>
  <span class="badge" id="badgeReady">加载中</span>
  <span class="badge" id="badgeLogin">未登录</span>
  <span class="badge" id="badgeLib">音乐 0</span>
  <span style="flex:1"></span>
  <span class="badge mono" id="badgeHost"></span>
  <a class="adminlink" href="/admin">后台</a>
</header>

<main>
  <div class="tabs" id="mainTabs">
    <button class="active" data-tab="play">播放</button>
    <button data-tab="library">音乐库</button>
  </div>

  <!-- 播放 -->
  <section class="panel active" id="tab-play">
    <div class="card">
      <h2>正在播放</h2>
      <select id="selDevice" style="max-width:280px"></select>
      <div class="localnote" id="localNote"></div>
      <div class="now" style="margin-top:12px">
        <div>
          <div class="title" id="nowTitle">—</div>
          <div class="hint" id="nowMeta"></div>
        </div>
      </div>
      <div class="prog" id="nowProg" style="display:none"><i></i></div>
      <div class="controls">
        <button class="ghost" onclick="ctl('prev')">上一首</button>
        <button class="primary" onclick="ctl('pause')">暂停</button>
        <button class="primary" onclick="ctl('resume')">继续</button>
        <button class="ghost" onclick="ctl('next')">下一首</button>
        <button class="ghost" onclick="ctl('stop')">停止</button>
      </div>
      <div class="controls">
        <span class="hint">音量</span>
        <input type="range" id="vol" min="0" max="100" oninput="setVol(this.value)">
        <span class="mono" id="volVal">38</span>
      </div>
      <div class="controls">
        <span class="hint">模式</span>
        <select id="selMode" style="max-width:210px" onchange="setMode(this.value)">
          <option value="NORMAL">顺序播放 · 放完即停</option>
          <option value="REPEAT_ONE">单曲循环 · 这首重放</option>
          <option value="REPEAT_ALL">全部循环 · 放完重头</option>
          <option value="SHUFFLE">随机播放 · 打乱后放完即停</option>
        </select>
        <span class="hint">顺序与随机都是「列表放完就停」，只有全部循环会回头接着放</span>
      </div>
    </div>
    <div class="card">
      <h2>队列</h2>
      <div id="queue" class="empty">暂无</div>
    </div>
  </section>

  <!-- 音乐库 -->
  <section class="panel" id="tab-library">
    <div class="card">
      <h2>搜索与点播</h2>
      <div class="row">
        <div><input type="text" id="kw" placeholder="歌名 / 歌手关键词，回车播放" onkeydown="if(event.key==='Enter')playKw()"></div>
        <div style="flex:0 0 auto"><button class="primary" onclick="playKw()">播放</button></div>
      </div>
      <div class="controls">
        <button class="ghost" onclick="rescan()">重新扫描音乐库</button>
        <span class="hint">文件夹＝音乐目录下的子目录；歌手取自音频标签；歌单可自己攒</span>
      </div>
    </div>

    <div class="card">
      <div class="tabs libtabs" id="libTabs">
        <button class="active" data-lib="songs">所有歌曲</button>
        <button data-lib="folders">文件夹</button>
        <button data-lib="artists">歌手</button>
        <button data-lib="playlists">歌单</button>
      </div>

      <!-- 所有歌曲 -->
      <div class="libview active" id="lib-songs">
        <h2>所有歌曲 <span class="hint" id="libCount"></span></h2>
        <table class="songtable"><tbody id="songList"></tbody></table>
      </div>

      <!-- 文件夹 -->
      <div class="libview" id="lib-folders">
        <h2>文件夹 <span class="hint" id="folderCount"></span></h2>
        <div class="hint">对应「播放文件夹XX」，选父目录会连子目录一起播。</div>
        <table class="grouptable" style="margin-top:6px"><tbody id="folderList"></tbody></table>
      </div>

      <!-- 歌手 -->
      <div class="libview" id="lib-artists">
        <h2>歌手 <span class="hint" id="artistCount"></span></h2>
        <div class="hint">对应「播放歌手XX」。没有歌手标签的曲目会归到「未知歌手」。</div>
        <table class="grouptable" style="margin-top:6px"><tbody id="artistList"></tbody></table>
      </div>

      <!-- 歌单 -->
      <div class="libview" id="lib-playlists">
        <h2>歌单 <span class="hint" id="plCount"></span></h2>
        <div class="hint">对应「播放歌单XX」。任意标签下的歌曲都能用行尾的「加入歌单」收进来。</div>
        <div class="controls">
          <input type="text" id="newPlName" placeholder="新歌单名" style="max-width:220px"
                 onkeydown="if(event.key==='Enter')createPlaylist()">
          <button class="ghost" onclick="createPlaylist()">新建歌单</button>
        </div>
        <table class="grouptable"><tbody id="playlistList"></tbody></table>
      </div>
    </div>
  </section>

</main>

<script src="/static/common.js"></script>
<script>
let S = {players:[], curDid:null, cur:null, metaBase:'',
         lastLibCount:null, playlistCounts:{}};
let activeLib = 'songs';   // 音乐库当前标签：songs | folders | artists | playlists
const DID_KEY = 'mibox.did';   // 记住上次选的输出设备（本机播放存成 'local'）



document.querySelectorAll('#mainTabs button').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('#mainTabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
    const t = b.dataset.tab;
    if(t === 'library'){ loadLibrary().catch(()=>{}); }
  };
});

// 音乐库里的四个标签：所有歌曲 / 文件夹 / 歌手 / 歌单
document.querySelectorAll('#libTabs button').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('#libTabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.libview').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    activeLib = b.dataset.lib;
    document.getElementById('lib-'+activeLib).classList.add('active');
    loadLibrary().catch(e=>toast('读取失败: '+e.message, true));
  };
});

// 点空白处 / 按 Esc 收起「加入歌单」菜单
document.addEventListener('click', e=>{
  const m = document.getElementById('pickMenu');
  if(m.style.display === 'block' && !m.contains(e.target) && !e.target.closest('.addpick')){
    closePick();
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closePick(); });

async function refresh(){
  // 页面在后台时不做轮询
  if(document.hidden) return;
  try{
    const st = await api('/api/status');
    S.players = st.players || [];
    setBadge('badgeReady',
      st.booting ? '初始化中…'
        : (st.xiaomi_ready ? '就绪' : (st.ready ? '本机播放可用' : '未就绪')),
      st.booting ? 'warn' : (st.xiaomi_ready ? 'ok' : (st.ready ? 'warn' : 'err')));
    setBadge('badgeLogin', st.logged_in?'已登录':'未登录', st.logged_in?'ok':'err');
    setBadge('badgeLib', '音乐 '+st.library_count);
    document.getElementById('badgeHost').textContent = st.hostname+':'+st.web_port;
    if(st.error){ setBadge('badgeReady', st.error.slice(0,30), 'warn'); }

    // 服务端曲库数量变化（扫描完成/重新初始化）时，自动刷新音乐库列表
    if(S.lastLibCount !== null && st.library_count !== S.lastLibCount){
      loadLibrary().catch(()=>{});
    }
    S.lastLibCount = st.library_count;

    const sel = document.getElementById('selDevice');
    // 用 did 列表当签名：只比数量会在"音箱增减但总数不变"时漏掉重建
    const sig = S.players.map(p=>p.did).join(',');
    if(sel.dataset.sig !== sig){
      sel.dataset.sig = sig;
      sel.innerHTML = S.players.map(p=>
        `<option value="${p.did}">${p.name||p.did}${p.is_local?'':' · 音箱'}</option>`).join('');
      const loc = S.players.find(p=>p.is_local);
      const saved = localStorage.getItem(DID_KEY);   // 'local' 或某台音箱的 did
      if(saved === 'local' && loc){
        S.curDid = loc.did;                          // 上次选的是本机播放
      }else if(saved && S.players.some(p=>p.did===saved)){
        S.curDid = saved;                            // 上次选的音箱还在
      }else if(!S.curDid || !S.players.some(p=>p.did===S.curDid)){
        // 没记录（或记的是上一个会话的 local:xxx）就默认本机播放
        S.curDid = loc ? loc.did : (S.players[0] && S.players[0].did);
      }
      sel.value = S.curDid;
    }
    S.curDid = sel.value || S.curDid;
    S.cur = S.players.find(p=>p.did===S.curDid) || null;
    // 本机播放的 did 每标签页都不同，所以只存 'local' 这个类型占位
    if(S.cur) localStorage.setItem(DID_KEY, S.cur.is_local ? 'local' : S.cur.did);
    renderPlayer(S.cur);
  }catch(e){ console.warn(e); }
}

function setBadge(id, text, cls){
  const el = document.getElementById(id);
  el.textContent = text; el.className = 'badge'+(cls?' '+cls:'');
}

function renderPlayer(p){
  if(!p){
    document.getElementById('nowTitle').textContent = '—';
    document.getElementById('nowMeta').textContent = '';
    syncLocalAudio(null);
    renderMini(null);
    return;
  }
  // 队列还在但已经没有在播的曲目 = 顺序/随机模式把列表放完了
  const done = !p.current && p.total > 0;
  document.getElementById('nowTitle').textContent = p.current
    ? p.current.name : (done ? '列表已播放完毕' : '—');
  const src = p.is_local ? '本机浏览器'
    : (p.status_source === 'home_assistant'
        ? `HA ${(p.ha_entity||'').replace('media_player.','')}`
        : '小米 API');
  S.metaBase = done
    ? `共 ${p.total} 首，已放完 · 想一直放就把模式改成「全部循环」`
    : `状态 ${p.state} · ${p.index+1}/${p.total} · 出声：${src}`;
  document.getElementById('nowMeta').textContent = S.metaBase;
  document.getElementById('localNote').textContent = p.is_local
    ? '本机播放：声音从打开这个页面的设备出来。每台设备各自独立，互不打断；对小爱说话仍由音箱出声。'
    : '';
  document.getElementById('vol').value = p.volume;
  document.getElementById('volVal').textContent = p.volume;
  document.getElementById('selMode').value = p.mode;
  const q = document.getElementById('queue');
  q.innerHTML = p.queue.length
    ? '<table>' + p.queue.map((s,i)=>
        `<tr class="clickable" onclick="jump(${i})"><td>${i+1}</td><td>${s.name}</td><td>${fmt(s.duration)}</td></tr>`
      ).join('') + '</table>'
    : '<div class="empty">暂无</div>';
  syncLocalAudio(p);
  renderMini(p);
  updateLocalProgress();
}

/* ---------- 本机播放：服务端管队列，浏览器负责出声 ---------- */
let AUDIO = null;      // <audio> 元素
let CUR_PLAY = null;   // 当前已装载的 "did|play_id|url"，用来判断要不要换 src
function audioEl(){ if(!AUDIO) AUDIO = document.getElementById('localAudio'); return AUDIO; }

function syncLocalAudio(p){
  const a = audioEl();
  if(!a) return;
  if(!p || !p.is_local){
    // 切到音箱了：本机必须闭嘴，免得两套一起响
    if(!a.paused) a.pause();
    CUR_PLAY = null;
    hideAudioGate();
    updateLocalProgress();
    return;
  }
  const cur = p.current;
  if(!cur || !cur.url){
    if(!a.paused) a.pause();
    CUR_PLAY = null;
    hideAudioGate();
    updateLocalProgress();
    return;
  }
  a.volume = Math.max(0, Math.min(1, (p.volume||50)/100));
  const key = `${p.did}|${p.play_id||0}|${cur.url}`;
  if(key !== CUR_PLAY){
    CUR_PLAY = key;
    a.src = cur.url;
    startAudio();          // 换歌：装载新地址并起播
    return;
  }
  // 同一首：只对齐播放状态（暂停/继续/停止）
  if(p.state === 'paused' && !a.paused) a.pause();
  else if(p.state === 'playing' && a.paused) startAudio();
  updateLocalProgress();
}

function startAudio(){
  const a = audioEl();
  if(!a || !a.src) return;
  try{
    const pr = a.play();
    // 浏览器要求先有用户交互才允许出声；被拦下时给一个明显的开始按钮
    if(pr && pr.catch) pr.catch(()=>showAudioGate());
    else hideAudioGate();
  }catch(e){ showAudioGate(); }
}
function showAudioGate(){
  if(S.cur && S.cur.is_local){
    document.getElementById('audioGate').style.display = 'block';
  }
}
function hideAudioGate(){ document.getElementById('audioGate').style.display = 'none'; }

function updateLocalProgress(){
  const a = audioEl();
  const p = S.cur;
  const bar = document.getElementById('nowProg');
  const mb = document.getElementById('miniProg');
  const live = !!(p && p.is_local && a && a.duration && !isNaN(a.duration));
  for(const el of [bar, mb]){
    if(!el) continue;
    el.style.display = live ? 'block' : 'none';
    if(el.firstElementChild) el.firstElementChild.style.width =
      live ? Math.min(100, a.currentTime / a.duration * 100) + '%' : '0';
  }
  if(live){
    document.getElementById('nowMeta').textContent =
      `${S.metaBase} · ${fmt(a.currentTime)} / ${fmt(a.duration)}`;
  }
}

function renderMini(p){
  document.getElementById('miniTitle').textContent =
    (p && p.current) ? p.current.name : '未在播放';
  document.getElementById('miniSub').textContent = (p && p.current)
    ? `${p.index+1}/${p.total} · ${p.is_local ? '本机播放' : (p.name||'音箱')}`
    : '';
  document.getElementById('miniPlay').textContent =
    (p && p.state === 'playing') ? '‖' : '▶';
}
async function miniToggle(){
  if(S.cur && S.cur.state === 'playing') await ctl('pause');
  else await ctl('resume');
}

async function ctl(a){
  await post(`/api/player/${S.curDid}/control`,{action:a});
  await refresh();
  // 本机播放：让 <audio> 立刻跟上服务端状态，别等下一次轮询
  if(S.cur && S.cur.is_local && audioEl()){
    if(a === 'pause' || a === 'stop') audioEl().pause();
    else if(a === 'resume') startAudio();
  }
}
async function setVol(v){
  document.getElementById('volVal').textContent = v;
  if(S.cur && S.cur.is_local && audioEl()) audioEl().volume = Math.max(0, Math.min(1, v/100));
  await post(`/api/player/${S.curDid}/volume`,{volume:+v});
}
async function setMode(m){
  // 切到随机后端会立即打乱队列，刷新一下让重排后的顺序即时可见
  await post(`/api/player/${S.curDid}/mode`,{mode:m});
  refresh();
}
async function jump(i){ await post(`/api/player/${S.curDid}/play`,{index:i}); refresh(); }

async function loadLibrary(){
  // 歌单名列表随时保持最新，「加入歌单」菜单在任何一个标签下都要能用
  try{ S.playlistCounts = await api('/api/playlists'); }
  catch(e){ S.playlistCounts = S.playlistCounts || {}; }

  if(activeLib === 'songs'){
    const d = await api('/api/library?limit=500');
    document.getElementById('libCount').textContent = `共 ${d.library_total} 首`;
    document.getElementById('songList').innerHTML = songRows(d.songs);
  } else if(activeLib === 'folders' || activeLib === 'artists'){
    const kind = activeLib === 'folders' ? 'folder' : 'artist';
    const map = await api(activeLib === 'folders' ? '/api/folders' : '/api/artists');
    renderGroups(kind, map);
  } else {
    renderPlaylists(S.playlistCounts);
  }
}

/* ---------- 通用行渲染 ---------- */
function songRows(songs, fromPlaylist){
  if(!songs || !songs.length) return '<tr><td class="hint">没有曲目</td></tr>';
  return songs.map((s,i)=>`<tr>
    <td>${i+1}</td>
    <td>${esc(s.name)}</td>
    <td>${esc(s.artist)}</td>
    <td class="hint">${esc(s.folder)}</td>
    <td class="mono">${s.duration?fmt(s.duration):'--:--'}</td>
    <td class="ops">
      <button class="ghost mini" onclick="playSong(this)" data-rel="${esc(s.rel)}">播放</button>
      ${fromPlaylist
        ? `<button class="ghost mini" onclick="removeFromPlaylist(this)" data-rel="${esc(s.rel)}" data-pl="${esc(fromPlaylist)}">移出</button>`
        : `<button class="ghost mini addpick" onclick="pickPlaylist(this)" data-rel="${esc(s.rel)}" data-name="${esc(s.name)}">加入歌单</button>`}
    </td></tr>`).join('');
}
function renderGroups(kind, map){
  const names = Object.keys(map||{});
  const label = kind === 'folder' ? '文件夹' : '歌手';
  const total = names.reduce((a,n)=>a+map[n], 0);
  document.getElementById(kind+'Count').textContent =
    names.length ? `${names.length} 个${label} · 共 ${total} 首` : '';
  document.getElementById(kind+'List').innerHTML = names.length
    ? names.map(n=>`<tr>
        <td class="gname">${esc(n)}</td>
        <td class="hint">${map[n]} 首</td>
        <td class="ops" style="width:190px">
          <button class="ghost mini" onclick="playGroup(this)" data-kind="${kind}" data-name="${esc(n)}">播放</button>
          <button class="ghost mini tgl" onclick="toggleGroup(this)" data-kind="${kind}" data-name="${esc(n)}">展开</button>
        </td></tr>`).join('')
    : `<tr><td class="hint">曲库为空，先扫描音乐目录</td></tr>`;
}
function renderPlaylists(map){
  const names = Object.keys(map||{});
  document.getElementById('plCount').textContent = names.length ? `共 ${names.length} 个` : '';
  document.getElementById('playlistList').innerHTML = names.length
    ? names.map(n=>`<tr data-name="${esc(n)}">
        <td class="gname">${esc(n)}</td>
        <td class="hint">${map[n]} 首</td>
        <td class="ops" style="width:250px">
          <button class="ghost mini" onclick="playPlaylist(this)" data-name="${esc(n)}">播放</button>
          <button class="ghost mini" onclick="openPlaylist(this.dataset.name)" data-name="${esc(n)}">查看</button>
          <button class="ghost mini danger" onclick="deletePlaylist(this)" data-name="${esc(n)}">删除</button>
        </td></tr>`).join('')
    : `<tr><td class="hint">还没有歌单，上面新建一个</td></tr>`;
}

/* 把歌曲表插到某一行的正下方（而不是追加到表格末尾） */
function insertSongsUnder(row, html){
  const td = document.createElement('td');
  td.colSpan = Math.max(1, row.children.length);
  td.innerHTML = `<div class="sublist">${html}</div>`;
  const tr = document.createElement('tr');
  tr.className = 'expandrow';
  tr.appendChild(td);
  row.after(tr);
}

/* ---------- 播放 ---------- */
async function playSong(btn){
  await post(`/api/player/${S.curDid}/play`,{song: btn.dataset.rel});
  refresh();
}
async function playGroup(btn){
  const key = btn.dataset.kind === 'folder' ? 'folder' : 'artist';
  try{
    await post(`/api/player/${S.curDid}/play`, {[key]: btn.dataset.name});
    toast(`开始播放「${btn.dataset.name}」`);
    refresh();
  }catch(e){ toast('播放失败: '+e.message, true); }
}
async function playPlaylist(btn){
  try{
    await post(`/api/player/${S.curDid}/play`, {playlist: btn.dataset.name});
    toast(`开始播放歌单「${btn.dataset.name}」`);
    refresh();
  }catch(e){ toast('播放失败: '+e.message, true); }
}
async function toggleGroup(btn){
  const kind = btn.dataset.kind;              // folder | artist
  const list = document.getElementById(kind+'List');
  const row = btn.closest('tr');
  if(!row) return;

  // 同一时间只摊开一组：先把已展开的行和按钮状态都收回去
  list.querySelectorAll('tr.expandrow').forEach(r=>r.remove());
  list.querySelectorAll('.tgl').forEach(b=>{ b.dataset.open=''; b.textContent='展开'; });
  if(btn.dataset.open === '1') return;        // 原来就是展开的，这次只是收起

  const q = `${kind}=${encodeURIComponent(btn.dataset.name)}&limit=500`;
  const d = await api('/api/library?'+q);
  const body = d.total
    ? `<table class="songtable">${songRows(d.songs)}</table>`
    : '<div class="empty">没有曲目</div>';
  // 插在被点击那一行的正下方，而不是表格最底下
  insertSongsUnder(row,
    `<div class="hint">「${esc(btn.dataset.name)}」· ${d.total} 首</div>${body}`);
  btn.dataset.open = '1'; btn.textContent = '收起';
}
async function playKw(){
  const kw = document.getElementById('kw').value.trim();
  if(!kw) return;
  try{
    await post(`/api/player/${S.curDid}/play`,{keyword:kw});
    refresh();
  }catch(e){ toast('没有匹配的歌曲', true); }
}
async function rescan(){
  toast('正在扫描音乐目录…');
  await post('/api/library/scan');
  await loadLibrary();
  refresh();
  toast('扫描完成');
}

/* ---------- 歌单 ---------- */
async function createPlaylist(){
  const el = document.getElementById('newPlName');
  const name = el.value.trim();
  if(!name){ toast('请先填歌单名', true); return; }
  try{
    await post('/api/playlists', {name});
    el.value = '';
    toast(`已新建歌单「${name}」`);
    await loadLibrary();
  }catch(e){ toast('新建失败: '+e.message, true); }
}
async function deletePlaylist(btn){
  const name = btn.dataset.name;
  if(!confirm(`删除歌单「${name}」？\n只删这个歌单，不会删任何音乐文件。`)) return;
  try{
    await api(`/api/playlists/${encodeURIComponent(name)}`, {method:'DELETE'});
    toast(`已删除歌单「${name}」`);
    await loadLibrary();
  }catch(e){ toast('删除失败: '+e.message, true); }
}
async function openPlaylist(name){
  const list = document.getElementById('playlistList');
  const row = [...list.querySelectorAll('tr')].find(r=>r.dataset.name === name);
  if(!row) return;

  list.querySelectorAll('tr.expandrow').forEach(r=>r.remove());
  list.querySelectorAll('tr').forEach(r=>{ r.dataset.open=''; });
  if(row.dataset.open === '1') return;        // 再点一次＝收起

  try{
    const d = await api(`/api/playlists/${encodeURIComponent(name)}`);
    const body = d.total
      ? `<table class="songtable">${songRows(d.songs, name)}</table>`
      : '<div class="empty">这个歌单还是空的</div>';
    insertSongsUnder(row,
      `<div class="hint">歌单「${esc(name)}」· ${d.total} 首</div>${body}`);
    row.dataset.open = '1';
  }catch(e){ toast('读取失败: '+e.message, true); }
}
async function removeFromPlaylist(btn){
  try{
    await post(`/api/playlists/${encodeURIComponent(btn.dataset.pl)}/remove`, {song: btn.dataset.rel});
    toast('已移出歌单');
    await loadLibrary();
    await openPlaylist(btn.dataset.pl);
  }catch(e){ toast('移出失败: '+e.message, true); }
}

/* ---------- 加入歌单的弹出菜单 ---------- */
let PICK_REL = '';
function pickPlaylist(btn){
  PICK_REL = btn.dataset.rel;
  const m = document.getElementById('pickMenu');
  const names = Object.keys(S.playlistCounts||{});
  m.innerHTML = (names.length
      ? names.map(n=>`<button onclick="pickChoose(this)" data-name="${esc(n)}">${esc(n)}
           <span class="hint">${S.playlistCounts[n]} 首</span></button>`).join('')
      : '<div class="hint" style="padding:6px 10px">还没有歌单，先新建一个</div>')
    + '<div class="sep"></div><button onclick="pickNew()">＋ 新建歌单…</button>';
  m.style.display = 'block';
  // 贴着按钮右下角展开，靠近视口边缘时向内收
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  let x = Math.min(r.left, window.innerWidth - w - 8);
  let y = r.bottom + 6;
  if(y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 6);
  m.style.left = Math.max(8, x) + 'px';
  m.style.top = y + 'px';
}
function closePick(){ document.getElementById('pickMenu').style.display = 'none'; }
async function pickChoose(btn){ await addToPlaylist(btn.dataset.name, PICK_REL); }
async function pickNew(){
  const n = prompt('新歌单名：');
  if(!n || !n.trim()) return;
  await addToPlaylist(n.trim(), PICK_REL);
}
async function addToPlaylist(name, rel){
  closePick();
  try{
    const r = await post(`/api/playlists/${encodeURIComponent(name)}/songs`, {song: rel});
    S.playlistCounts = r.playlists || S.playlistCounts;
    toast(r.added ? `已加入歌单「${r.name}」` : `「${r.name}」里已经有这首歌了`);
    if(activeLib === 'playlists') await loadLibrary();
  }catch(e){ toast('加入失败: '+e.message, true); }
}


refresh();
// 未登录时部分接口会失败，逐个 catch 避免整体脚本中断
loadLibrary().catch(()=>{});
setInterval(refresh, 5000);
// 页面重新可见时立刻刷新一次
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });
document.getElementById('selDevice').onchange = () => { refresh(); };

/* ---------- 本机播放事件 ---------- */
const localAudio = document.getElementById('localAudio');
// 一首播完 -> 告诉服务端，由它推进队列；刷新后 renderPlayer 会装载下一首
localAudio.addEventListener('ended', async ()=>{
  if(!S.cur || !S.cur.is_local) return;
  try{ await post(`/api/player/${S.curDid}/sync`, {event:'ended'}); }
  catch(e){ console.warn(e); }
  refresh();
});
localAudio.addEventListener('timeupdate', updateLocalProgress);
localAudio.addEventListener('play', ()=>hideAudioGate());
// 浏览器卡住/拉不到文件时别干等：报个错，让服务端切下一首
localAudio.addEventListener('error', ()=>{
  if(!S.cur || !S.cur.is_local || !localAudio.src) return;
  toast('这首播不出来，切下一首');
  post(`/api/player/${S.curDid}/sync`, {event:'ended'})
    .then(()=>refresh()).catch(()=>{});
});
</script>
<div id="pickMenu" class="pickmenu"></div>
<div id="toast" class="toast"></div>

<!-- 本机播放：声音从打开这个页面的设备出来 -->
<audio id="localAudio" preload="none"></audio>
<button id="audioGate" onclick="startAudio();hideAudioGate()">▶ 点击开始播放</button>

<!-- 移动端底部迷你播放条 -->
<div class="minibar" id="minibar">
  <div class="prog" id="miniProg" style="display:none"><i></i></div>
  <div class="mt">
    <div class="t" id="miniTitle">未在播放</div>
    <div class="s" id="miniSub"></div>
  </div>
  <button onclick="ctl('prev')" aria-label="上一首">‹</button>
  <button id="miniPlay" onclick="miniToggle()" aria-label="播放/暂停">▶</button>
  <button onclick="ctl('next')" aria-label="下一首">›</button>
</div>
</body>
